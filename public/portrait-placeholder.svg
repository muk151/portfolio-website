<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 940" role="img" aria-labelledby="portrait-title portrait-desc">
  <title id="portrait-title">Placeholder portrait silhouette</title>
  <desc id="portrait-desc">An original, high contrast illustration of a person in an angular jacket, turning toward the left and adjusting their collar.</desc>
  <defs>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2.3" fill="#0A0A0A"/>
    </pattern>
    <clipPath id="face-clip">
      <path d="M275 250 292 165 365 112 463 119 530 177 548 278 520 383 474 458 399 490 324 451 274 368Z"/>
    </clipPath>
    <clipPath id="coat-clip">
      <path d="M68 940 86 760 133 644 244 569 326 550 390 613 477 533 565 542 660 630 733 940Z"/>
    </clipPath>
  </defs>

  <!-- The white border keeps the cutout legible on red or black backgrounds. -->
